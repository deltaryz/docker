# ./.env file is required for gluetun to function
# ./Caddyfile is required for caddy to function
# MINIMAX_API_KEY must be set in .env for the opencode service

services:

  # Caddy webserver
  caddy:
    image: abiosoft/caddy:no-stats
    container_name: caddy
    restart: always
    environment:
      - ACME_AGREE=true
    ports:
      - "4567:4567"
      - "5678:5678"
    volumes:
      - "./Caddyfile:/etc/Caddyfile"
      - "caddy_data:/root/.caddy"
      - "/home/delta/∆•MIX:/srv"
      - "/home/delta/doritoshare:/doritoshare"

  # Navidrome Music Server (Subsonic API)
  navidrome:
    image: deluan/navidrome:0.51.1
    container_name: navidrome
    ports:
      - "4533:4533"
    volumes:
      - /home/delta/navidrome:/data
      - /home/share/doritomusic:/music:ro
    environment:
      ND_SCANSCHEDULE: 1m
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      ND_IMAGECACHESIZE: 10000MB
      ND_COVERARTPRIORITY: "embedded, cover.*"
      ND_ENABLECOVERANIMATION: "false"
      ND_ENABLEEXTERNALSERVICES: "false"
      ND_ENABLESHARING: "true"
    restart: always

  # gayrealm (minecraft server)
  minecraft:
    image: eclipse-temurin:25-jdk
    container_name: minecraft
    working_dir: /server
    volumes:
      - /home/delta/minecraft/gayrealm:/server
    ports:
      - "25565:25565"
      - "19132:19132/udp"
      - "8100:8100" # BlueMap
    command: /server/start.sh
    mem_limit: 10g
    restart: always
    stop_grace_period: 60s
    networks:
      - default
      - mc-internal

  # # black ops 2 server
  # blops2:
  #   image: scottyhardy/docker-wine:latest
  #   container_name: blops2
  #   restart: unless-stopped
  #   environment:
  #     - WINEDEBUG=-all
  #     - DISPLAY=
  #   volumes:
  #     - /home/delta/blackops2/T6:/home/wineuser/.wine/drive_c/gameserver/T6
  #     - /home/delta/blackops2/appdata:/home/wineuser/.wine/drive_c/users/wineuser/AppData/Local/Plutonium
  #   working_dir: /home/wineuser/.wine/drive_c/gameserver/T6
  #   command: >
  #     wine cmd.exe /C !start_mp_server.bat
  #   network_mode: host

  # OpenCode AI sidecar (opencode 1.14.33)
  opencode:
    build:
        context: /home/delta/minecraft/gayrealm/opencode-bin
        dockerfile: Dockerfile
    container_name: opencode
    user: root
    working_dir: /workspace
    volumes:
      - /home/delta/minecraft/gayrealm/opencode-bin:/workspace
      - /home/delta/minecraft/gayrealm:/server:ro
      - /home/delta/minecraft/gayrealm/opencode-config:/root/.config/opencode
    environment:
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - OPENCODE_ENABLE_EXA=1
      - HTTP_PROXY=http://vpn:8888
      - HTTPS_PROXY=http://vpn:8888
      - NO_PROXY=minecraft,localhost,127.0.0.1
    entrypoint: ["/workspace/start.sh"]
    restart: unless-stopped
    networks:
      - default
      - mc-internal

  # transfer.sh file sharing
  transfer:
    image: dutchcoders/transfer.sh:latest
    container_name: transfer
    restart: always
    command: --provider local --basedir /data --purge-days 7 --purge-interval 1
    volumes:
      - ./transfer:/data
    ports:
      - "8734:8080"
    environment:
      - BASEDIR=/data

  # PS3netsrv
  ps3netsrv:
    image: debian:bookworm-slim
    container_name: ps3netsrv
    volumes:
      - /home/share/ps3netsrv:/data:ro
    working_dir: /data
    ports:
      - "38008:38008"
    command: /data/ps3netsrv_linuxX86_64
    restart: always

  # Gluetun VPN (Mullvad)
  vpn:
    image: qmcgaw/gluetun:latest
    container_name: vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY} # ./.env
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - UPDATER_PERIOD=12h
      - SERVER_CITIES=Stockholm
      - DNS_ADDRESS=1.1.1.1
      - HTTPPROXY=on
    volumes:
      - "./gluetun_config:/gluetun"
    ports:
      - "6789:6789"      # NZBget Web UI
      - "8112:8112"      # Deluge Web UI
      - "6881:6881"      # Deluge Inbound
      - "6881:6881/udp"  # Deluge Inbound
      - "58846:58846"    # deluged thin client
    restart: always

  # NZBGet
  nzbget:
    image: linuxserver/nzbget
    container_name: nzbget
    depends_on:
      - vpn
    network_mode: "service:vpn"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      - NZBGET_USER=${NZBGET_USER}
      - NZBGET_PASS=${NZBGET_PASS}
    volumes:
      - ./nzbget_config:/config
      - /home/share/nzbget:/downloads
    restart: always

  # Deluge torrent client
  deluge:
    image: linuxserver/deluge:latest
    container_name: deluge
    depends_on:
      - vpn
    network_mode: "service:vpn"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      - DELUGE_LOGLEVEL=error
    volumes:
      - /home/share/torrents:/downloads
      - ./deluge_config:/config
    restart: always

  # Open WebUI - LM Studio frontend
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: always
    environment:
      - OPENAI_API_KEY=lmstudio
      - OPENAI_API_BASE_URL=http://192.168.69.132:1234/v1
    ports:
      - "3069:8080"
    volumes:
      - ./open-webui:/app/backend/data

  # Soulseek Web UI
  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    restart: unless-stopped
    ports:
      - "5030:5030"
      - "50300:50300"
    environment:
      - SLSKD_REMOTE_CONFIGURATION=true
    volumes:
      - ./slskd-data:/app
      - /home/share/doritomusic:/music:ro
      - /home/share/ROMs:/roms:ro
    user: "1000:1000"

networks:
  mc-internal:
    # Internal network for minecraft <-> opencode communication
    internal: true

volumes:
  caddy_data:
  open-webui:
