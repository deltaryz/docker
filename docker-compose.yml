services:

  # Caddy webserver
  caddy:
    networks:
      - dockernet
    build:
      context: .
      dockerfile: Dockerfile-caddy
    # image: abiosoft/caddy:no-stats
    container_name: caddy
    # Zero data retention (deltaryz, 2026-11-09): without this, EVERYTHING caddy
    # prints is appended to /var/lib/docker/containers/<id>/<id>-json.log by the
    # default json-file driver -- including error lines that carry client IPs
    # ("TLS handshake error from <ip>", "No such site at :80 (Remote: <ip>)").
    # ~400k lines / 60 MB had accumulated. "none" means docker keeps no copy at
    # all; caddy still writes to its own stdout, it just isn't stored. Cost: no
    # `docker logs caddy` for reading Caddyfile parse errors -- validate a config
    # change in a throwaway container first (README-OPS if present, else:
    #   docker run -d --network none -v ./Caddyfile:/etc/Caddyfile:ro docker-caddy \
    #     --conf /etc/Caddyfile --agree=true  -> docker logs <id>)
    logging:
      driver: "none"
    restart: always
    environment:
      - ACME_AGREE=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./Caddyfile:/etc/Caddyfile"
      - "caddy_data:/root/.caddy"
      - "/home/delta/web:/srv"
      # request log with no identifiers (method/path/status only) -- see the
      # `log` block on pvfm.deltaryz.com in the Caddyfile. Non-identifiable, so
      # retaining it is fine; it is the only log this container keeps.
      - "./caddy-logs:/logs"

  # Syncthing file sync daemon and webui
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    environment:
      - PUID=1002
      - PGID=1002
      - TZ=America/Los_Angeles
    volumes:
      - /home/delta/syncthing_config:/config
      - /home/delta/syncthing:/data1
    ports:
      - 100.103.133.29:8384:8384
      - 100.103.133.29:22000:22000/tcp
      - 100.103.133.29:22000:22000/udp
      - 100.103.133.29:21027:21027/udp
    restart: always

  # Velocity proxy for floof.zone Minecraft server
  # (Runs on atybox)
  velocity:
    image: eclipse-temurin:26-jre-ubi10-minimal
    container_name: velocity
    working_dir: /server
    volumes:
      - /home/delta/velocity:/server
    ports:
      - "25565:25565"
      - "19132:19132/udp"
    command: >
      bash -c "java -Xms1G -Xmx1G -XX:+UseG1GC -XX:G1HeapRegionSize=4M
      -XX:+UnlockExperimentalVMOptions -XX:+ParallelRefProcEnabled
      -XX:+AlwaysPreTouch -XX:MaxInlineLevel=15
      -jar /server/velocity-*.jar"
    mem_limit: 2g
    restart: unless-stopped

  # rasync (retroarch sync system)
  rasync:
    image: python:3.12-slim
    container_name: retroarchsync
    volumes:
      - /home/delta/retroarchsync:/app
      - /home/delta/syncthing/retroarch:/retroarch
    working_dir: /app
    ports:
      - "100.103.133.29:8769:8769"
    command: bash -c "pip install flask -q && python rasync.py"
    restart: always

  # Server for horsepower.deltaryz.com
  horsepower:
    networks:
      - dockernet
    image: python:3.12-slim
    restart: always
    container_name: horsepower
    ports:
      - "7499:7499"
    volumes:
      - "./horsepower:/app"
    entrypoint: [ "python3", "/app/serve.py", "-p", "7499", "-r", ".", "-n" ]
    #command: python3 /app/serve.py -p 7495 -r . -n

    # Server for goty2 multiplayer dungeon
  goty2:
    networks:
      - dockernet
    build:
      context: .
      dockerfile: Dockerfile-goty2
    container_name: goty2
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - "/home/delta/web/goty2.floof.zon:/srv"

  # Deltamix youtube stream checker
  stream-update:
    networks:
      - dockernet
    build:
      context: ./stream-update
      dockerfile: Dockerfile
    container_name: stream-update
    environment:
      - YT_API_KEY=${YT_API_KEY}
    ports:
      - "3001:3001"
    restart: always

  # pvfm metadata proxy -- PVFM dropped CORS on their metadata endpoints, so
  # /data/* is served same-origin by this container instead of direct from
  # ponyvillefm.com. Code in ./pvfm-proxy, reached only over dockernet by caddy.
  pvfm-proxy:
    networks:
      - dockernet
    image: python:3.12-slim
    container_name: pvfm-proxy
    restart: always
    volumes:
      - "./pvfm-proxy:/app:ro"
    entrypoint: [ "python3", "-u", "/app/proxy.py" ]
    environment:
      - PORT=8080
    mem_limit: 128m

  # Browser VS Code for the iPad (and any other browser).
  #
  # Access control is the tailnet, by deltaryz's decision: the port is published
  # only on the tailnet IP (same pattern as syncthing and rasync), so nothing on
  # the LAN or the internet can reach it, and code-server runs with auth none --
  # no login, no password to lose. Her call and a deliberate one: devious is on
  # this tailnet and trusted, and "if anyone untrusted gets into my tailnet I have
  # bigger problems". Note what that means in practice: tailnet access to this
  # port is a shell on doritosrv as delta (see the ssh key below), and delta is in
  # the docker group. To re-gate it later, set HASHED_PASSWORD (sha256 of a
  # password) in .env and it picks up auth=password on the next recreate.
  #
  # It sees exactly ONE host path: /home/delta/dev. Note the mount point is
  # /code, not /dev -- a bind mount at /dev makes the whole container
  # unstartable (runc: "can't mask paths: open /dev/null: no such file or
  # directory"), because /dev is a masked device filesystem. /code is opened by
  # default via DEFAULT_WORKSPACE.
  #
  # /config/.ssh is the container's own key, mounted read-only-ish (it needs to
  # write known_hosts) so `ssh doritosrv` in the integrated terminal lands on the
  # host as delta with no password. The public half is in
  # /home/delta/.ssh/authorized_keys; regenerate both if you rotate it.
  code-server:
    networks:
      - dockernet
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    restart: always
    environment:
      - PUID=1002            # = delta on this host, so files in /code are his
      - PGID=1002
      - TZ=America/Los_Angeles
      - DEFAULT_WORKSPACE=/code
    ports:
      - "100.103.133.29:8443:8443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "/home/delta/dev:/code"
      - "/home/delta/codeserver:/config"
      - "/home/delta/codeserver-ssh:/config/.ssh"
    mem_limit: 1g

volumes:
  caddy_data:


networks:
  dockernet:
