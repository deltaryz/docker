version: "3.8"

services:
  unifi-controller:
    image: jacobalberty/unifi:v9.5.21
    platform: linux/amd64
    container_name: unifi
    restart: always

    network_mode: "bridge"

    ports:
      - "8443:8443"       # HTTPS controller UI
      - "8080:8080"       # inform URL
      - "3478:3478/udp"   # STUN
      - "10001:10001/udp" # device discovery
      - "1900:1900/udp"   # optional UPnP discovery
      - "6789:6789"       # speed test
      - "5514:5514/udp"   # syslog (optional)

    environment:
      - TZ=America/Los_Angeles
      - BIND_PRIV=1
      - UNIFI_HTTP_PORT=8080
      - UNIFI_HTTPS_PORT=8443

    volumes:
      - /home/delta/unifi/data:/unifi/data
      - /home/delta/unifi/logs:/unifi/log
      - /home/delta/unifi/run:/var/run/unifi


  # Minecraft (Purpur) - runs `floof.zone` Minecraft server
  # mem_limit 6g per deltaryz; start.sh's heap is 4G. The JVM runs with
  # AlwaysPreTouch, so it commits the whole heap on start and sits around
  # 4.6 GiB inside a 6g cap. Heap 5G would put it at 93% with no headroom.
  minecraft:
    image: eclipse-temurin:25-jdk
    container_name: minecraft
    working_dir: /server
    volumes:
      - /home/delta/game/minecraft:/server
    ports:
      - "25565:25565"      # Java
      - "19132:19132/udp"  # Bedrock (Geyser)
      - "8100:8100"        # BlueMap
    command: /server/start.sh
    mem_limit: 6g
    restart: always
    stop_grace_period: 60s
    networks:
      - default
      - mc-internal

  # OpenCode AI sidecar for the AIBridge plugin. AIBridge reaches it as
  # http://minecraft-ai:4200 (see plugins/AIBridge/config.yml), so the container
  # name matters and it has to be on the same internal network.
  opencode:
    build:
      context: /home/delta/game/minecraft/opencode-bin
      dockerfile: Dockerfile
    container_name: minecraft-ai
    user: root
    working_dir: /workspace
    volumes:
      - /home/delta/game/minecraft/opencode-bin:/workspace
      - /home/delta/game/minecraft:/server
      - /home/delta/game/minecraft/opencode-config:/root/.config/opencode
    environment:
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - OPENCODE_ENABLE_EXA=1
    entrypoint: ["/workspace/start.sh"]
    restart: unless-stopped
    networks:
      - default
      - mc-internal

  # Open WebUI - proxied publicly at rub.paws-on.me via doritosrv's caddy.
  # Primarily used to access models running in LM Studio on doritomac
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: always
    environment:
      - OPENAI_API_KEY=lmstudio
      - OPENAI_API_BASE_URL=http://192.168.69.132:1234/v1
    ports:
      - "3069:8080"
    volumes:
      - /home/delta/open-webui:/app/backend/data

  # ---------------------------------------------------------------------
  # Media stack, moved off doritobox with the array (2026-10-31).
  # ---------------------------------------------------------------------

  # Jellyfin. The image is PINNED to the 12.1 tag carried over from doritobox
  # byte-for-byte rather than pulled: `jellyfin/jellyfin:latest` upstream moved
  # past 12.1 in October 2026, and the whole point of the first boot is running
  # the same version that produced the config backup, so nothing migrates.
  # After encoders and playback verify, switch to jellyfin-txcap:12.3-rescap
  # (PROCEDURE.md §4.3) -- never to `latest`.
  jellyfin:
    image: jellyfin-txcap:12.3-rescap
    container_name: jellyfin
    user: "1000:1000"
    network_mode: host
    group_add:
      - video
      - 992
    volumes:
      # /home/delta/jellyfin is doritobox's whole jellyfin CONFIG ROOT (it holds
      # .jellyfin-data plus the nested config/, log/, metadata/, plugins/ and the
      # 62 GB data/ tree), so it mounts at /config as a whole. Mounting its
      # config/ subdir there instead puts the marker files a level out of place and
      # the server refuses to start: "Expected to find only .jellyfin-data but
      # found marker for /config/.jellyfin-config".
      - /home/delta/jellyfin:/config
      # cache stays outside that tree on purpose: a marker inside /config makes the
      # same sanity check fail again.
      - /home/delta/jellyfin-cache:/cache
      - /mnt/array/jellyfin/tv:/share/jellyfin/tv
      - /mnt/array/jellyfin/anime:/share/jellyfin/anime
      - /mnt/array/jellyfin/movies:/share/jellyfin/movies
      - /mnt/array/jellyfin/youtube:/share/jellyfin/youtube
    devices:
      - /dev/dri:/dev/dri
    restart: always

  # Gluetun VPN (Mullvad, WireGuard, Stockholm). Uses ATYBOX's device key, not
  # doritobox's: atybox's download stack is being retired, so its device slot
  # and its key move here (deltaryz, 2026-10-31). Key/address live in ./.env.
  vpn:
    image: qmcgaw/gluetun:latest
    container_name: vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}   # ./.env
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}       # ./.env
      - UPDATER_PERIOD=12h
      - SERVER_CITIES=Stockholm
      - DNS_ADDRESS=1.1.1.1
      # let the namespace's containers reach the LAN: qBittorrent's search
      # plugin has to talk to Jackett on this host at 192.168.69.222:9117.
      # Private destinations only, never the internet, so no swarm leak.
      - FIREWALL_OUTBOUND_SUBNETS=192.168.69.0/24
      # the default icmp check never matches its own reply through the tunnel
      # and pins gluetun unhealthy forever
      - HEALTH_SMALL_CHECK_TYPE=dns
    volumes:
      - ./gluetun_config:/gluetun
    ports:
      - "8090:8090"   # qBittorrent Web UI (VueTorrent)
      - "6767:6789"   # nzbget Web UI: host 6767 (6789 is unifi's) -> the
                      # tunnel's own 6789, because nzbget's container healthcheck
                      # and its s6 init both poll 6789 and would never see 6767
    restart: always

  # qBittorrent. 5.1.4 is pinned on purpose: 5.2.x hangs the WebUI at 100% CPU
  # on GET /api/v2/search/plugins (upstream #24900). /downloads is the same
  # container path as on doritobox against the same bytes, so torrents resume
  # without a recheck; /staging is where copy-finished.sh drops verified copies.
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.1.4
    container_name: qbittorrent
    depends_on:
      - vpn
    network_mode: "service:vpn"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      - WEBUI_PORT=8090
      - TORRENTING_PORT=6990
      - DOCKER_MODS=ghcr.io/vuetorrent/vuetorrent-lsio-mod:latest
    volumes:
      - /mnt/array/torrents:/downloads
      - ./qbittorrent_config:/config
      - /mnt/array/staging:/staging
    restart: always

  # Jackett on host networking: indexer search traffic never joins a swarm, and
  # a residential IP passes Cloudflare more readily than a datacenter one.
  # Requests it makes to qBittorrent's WebUI then arrive from a LAN address
  # that WebUI\AuthSubnetWhitelist already trusts.
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - ./jackett_config:/config
      - /mnt/array/torrents:/downloads
    restart: always

  # Byparr: the Cloudflare solver Jackett calls. Host networking because the
  # clearance cookie is bound to the IP that solved the challenge; HOST=127.0.0.1
  # keeps it off the LAN so it is not an open browser proxy.
  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: byparr
    network_mode: host
    environment:
      - HOST=127.0.0.1
      - TZ=America/Los_Angeles
    shm_size: "1gb"
    restart: always

  # nzbget, inheriting atybox's responsibilities. It lands downloads in
  # /mnt/array/staging/nzb (bound to /downloads), so MainDir and DestDir in
  # nzbget.conf stay exactly as they are and only the bind moves. nzbget keeps
  # listening on 6789 inside the tunnel; only the PUBLISHED host port differs
  # (6767), which is why nothing in nzbget.conf had to change.
  nzbget:
    image: linuxserver/nzbget
    container_name: nzbget
    depends_on:
      - vpn
    network_mode: "service:vpn"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      - NZBGET_USER=${NZBGET_USER}
      - NZBGET_PASS=${NZBGET_PASS}
    volumes:
      - ./nzbget_config:/config
      - /mnt/array/staging/nzb:/downloads
    restart: always

networks:
  mc-internal:
    # Internal network for minecraft <-> opencode communication
    internal: true
