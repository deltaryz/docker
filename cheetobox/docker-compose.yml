version: "3.8"

services:
  unifi-controller:
    image: jacobalberty/unifi:v9.5.21
    platform: linux/amd64
    container_name: unifi
    restart: always

    network_mode: "bridge"

    ports:
      - "8443:8443"       # HTTPS controller UI
      - "8080:8080"       # inform URL
      - "3478:3478/udp"   # STUN
      - "10001:10001/udp" # device discovery
      - "1900:1900/udp"   # optional UPnP discovery
      - "6789:6789"       # speed test
      - "5514:5514/udp"   # syslog (optional)

    environment:
      - TZ=America/Los_Angeles
      - BIND_PRIV=1
      # Force controller to advertise only the correct IP:
      - UNIFI_HTTP_PORT=8080
      - UNIFI_HTTPS_PORT=8443
      #- UNIFI_INFORM_HOST=192.168.69.222

    volumes:
      - /home/delta/unifi/data:/unifi/data
      - /home/delta/unifi/logs:/unifi/log
      - /home/delta/unifi/run:/var/run/unifi


  # Minecraft (Purpur) -- ported from atybox, server dir is the absolute path
  # /home/delta/game/minecraft and is not moved or extracted into the image.
  # mem_limit 6g per deltaryz; start.sh's heap is 4G. The JVM runs with
  # AlwaysPreTouch, so it commits the whole heap on start and sits around
  # 4.6 GiB inside a 6g cap. Heap 5G would put it at 93% with no headroom.
  minecraft:
    image: eclipse-temurin:25-jdk
    container_name: minecraft
    working_dir: /server
    volumes:
      - /home/delta/game/minecraft:/server
    ports:
      - "25565:25565"      # Java
      - "19132:19132/udp"  # Bedrock (Geyser)
      - "8100:8100"        # BlueMap
    command: /server/start.sh
    mem_limit: 6g
    restart: always
    stop_grace_period: 60s
    networks:
      - default
      - mc-internal

  # OpenCode AI sidecar for the AIBridge plugin. AIBridge reaches it as
  # http://opencode:4200 (see plugins/AIBridge/config.yml), so the container
  # name matters and it has to be on the same internal network.
  # atybox sent it out through vpn:8888; there is no vpn on this box, so the
  # proxy vars are dropped and it uses the normal outbound route.
  opencode:
    build:
      context: /home/delta/game/minecraft/opencode-bin
      dockerfile: Dockerfile
    container_name: opencode
    user: root
    working_dir: /workspace
    volumes:
      - /home/delta/game/minecraft/opencode-bin:/workspace
      - /home/delta/game/minecraft:/server
      - /home/delta/game/minecraft/opencode-config:/root/.config/opencode
    environment:
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - OPENCODE_ENABLE_EXA=1
    entrypoint: ["/workspace/start.sh"]
    restart: unless-stopped
    networks:
      - default
      - mc-internal

networks:
  mc-internal:
    # Internal network for minecraft <-> opencode communication
    internal: true
